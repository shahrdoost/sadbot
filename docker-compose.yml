services:
  postgres:
    image: postgres:16-alpine
    container_name: sadbot-postgres
    environment:
      POSTGRES_DB: sadbot
      POSTGRES_USER: sadbot
      POSTGRES_PASSWORD: sadbot
    ports:
      - "5432:5432"
    volumes:
      - sadbot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sadbot -d sadbot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sadbot_pgdata:
