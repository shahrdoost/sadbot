<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<style>
__FONT_CSS__
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1080px; overflow: hidden; }
body {
  font-family: 'Vazirmatn', -apple-system, sans-serif;
  background: #0A0A0D;
  color: #F5F6F8;
  position: relative;
  direction: rtl;
}
.glow { position: absolute; border-radius: 50%; pointer-events: none; }
.glow-a {
  top: -240px; left: -200px; width: 760px; height: 760px;
  background: radial-gradient(circle, __GLOW_A__ 0%, transparent 70%);
}
.glow-b {
  bottom: -260px; right: -220px; width: 700px; height: 700px;
  background: radial-gradient(circle, __GLOW_B__ 0%, transparent 70%);
}
.glow-c {
  top: 30%; right: -180px; width: 420px; height: 420px;
  background: radial-gradient(circle, __GLOW_C__ 0%, transparent 70%);
}
.grid {
  position: absolute; inset: 0; opacity: 0.55;
  background-image:
    linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
  background-size: 54px 54px;
  -webkit-mask-image: radial-gradient(60% 45% at 28% 18%, black 20%, transparent 75%);
  mask-image: radial-gradient(60% 45% at 28% 18%, black 20%, transparent 75%);
}
.frame {
  position: relative; z-index: 2; height: 100%;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 64px 72px 56px;
}
.brand { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.brand .name-en {
  font-family: -apple-system, 'SF Pro Display', sans-serif;
  font-weight: 700; font-size: 40px; letter-spacing: -0.02em; direction: ltr;
  background: linear-gradient(120deg, #F5F6F8 25%, #3B6BE0 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.brand .name-fa { font-weight: 800; font-size: 34px; color: #9297A3; }
.card {
  background: rgba(255,255,255,0.035);
  border: none;
  border-radius: 24px;
  backdrop-filter: blur(20px);
  padding: 40px 44px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  overflow: hidden;
  max-height: 720px;
}
.card.has-image { padding: 22px; max-height: 780px; }
.media-wrap {
  border-radius: 18px; overflow: hidden; margin-bottom: 28px;
  border: none;
  background: #0F0F13;
  max-height: 340px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.media-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; max-height: 340px; }
.body-text {
  font-weight: 600; line-height: 1.75; color: #F5F6F8;
  white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
  text-align: right;
  font-size: 42px;
  overflow: hidden;
  max-height: 480px;
}
.card.has-image .body-text { font-size: 32px; max-height: 280px; }
.card.solo .body-text { font-size: 46px; max-height: 520px; }
.num {
  font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
  direction: ltr; unicode-bidi: isolate;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.01em;
  color: __ACCENT__;
}
.footer { display: flex; align-items: center; justify-content: space-between; }
.handle {
  font-family: -apple-system, 'SF Pro Text', sans-serif;
  direction: ltr; font-size: 24px; font-weight: 600; color: #9297A3;
}
.date {
  font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  direction: ltr; font-size: 22px; color: #5E6169;
}
.pill {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(28,81,197,0.18); border: 1px solid rgba(59,107,224,0.45);
  color: #3B6BE0; border-radius: 999px; padding: 8px 18px;
  font-size: 20px; font-weight: 700; margin-bottom: 22px;
}
.pill .dot {
  width: 8px; height: 8px; border-radius: 50%; background: #22C55E;
  box-shadow: 0 0 10px rgba(34,197,94,0.8);
}
</style>
</head>
<body>
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>
  <div class="glow glow-c"></div>
  <div class="grid"></div>

  <div class="frame">
    <div class="brand">
      <div class="name-en">__BRAND_EN__</div>
      <div class="name-fa">__BRAND_FA__</div>
    </div>

    <div class="card __CARD_CLASS__">
      <div class="pill"><span class="dot"></span> بازار · تحلیل</div>
      __MEDIA__
      <div class="body-text __TEXT_CLASS__" id="bodyText" style="__TEXT_STYLE__">__TEXT__</div>
    </div>

    <div class="footer">
      <div class="handle">__HANDLE__</div>
    </div>
  </div>

  <script>
    (function () {
      var el = document.getElementById('bodyText');
      if (!el) return;
      var t = el.textContent;
      // ارقام فارسی → لاتین، سپس هایلایت عددی
      t = t.replace(/[۰-۹]/g, function (d) {
        return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d);
      });
      t = t.replace(/[٠-٩]/g, function (d) {
        return '٠١٢٣٤٥٦٧٨٩'.indexOf(d);
      });
      var re = /([0-9][0-9.,:،%$KMkmBb+×÷=*/−-]{1,})/g;
      el.innerHTML = t.replace(re, '<span class="num">$1</span>');
    })();
  </script>
</body>
</html>
